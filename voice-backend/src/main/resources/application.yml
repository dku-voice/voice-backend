spring:
  datasource:
    # docker-compose의 MYSQL_DATABASE: voicedb와 일치해야 함
    url: jdbc:mysql://localhost:3306/voicedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # docker-compose의 MYSQL_ROOT_PASSWORD: voice1234
    username: root
    password: voice1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 엔티티 클래스를 보고 테이블을 자동으로 만들어줌
    properties:
      hibernate:
        format_sql: true
    show-sql: true            # 개발 중 쿼리 확인용 (운영 시 false)
 
  flyway:
    enabled: false            # Flyway 비활성화 (DataInitializer 방식 사용)
 

  data:
    redis:
      # docker-compose에서 6379 포트로 뚫어놓은 Redis 연결
      host: localhost
      port: 6379

server:
  port: 8080